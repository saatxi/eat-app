name: eatapp
description: "EatApp - personal restaurant notebook"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Brings the framework's own localized widgets/`MaterialLocalizations`; the
  # app's own copy lives in lib/core/l10n (see l10n.yaml).
  flutter_localizations:
    sdk: flutter

  # Required by the generated localizations classes. `any` lets it track
  # whatever version flutter_localizations pins.
  intl: any

  drift: ^2.35.0
  drift_flutter: 0.3.1
  # Directly used by test/data/db/migration_v16_test.dart to build a real v15
  # database file the migration runs against.
  sqlite3: 3.5.0
  diacritic: ^0.1.6
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  shared_preferences: ^2.5.5
  # Opens a restaurant's website/Instagram and the address in a map app from the
  # detail screen.
  url_launcher: ^6.3.1

  # The shared-groups backend (its schema and Edge Functions live in supabase/):
  # anonymous sign-in is the default identity, the sync layer talks to
  # Postgres through it, and photos go to its Storage bucket. The URL and the
  # anon key arrive via --dart-define, never hardcoded. The plain `supabase`
  # client (not `supabase_flutter`) on purpose: session persistence is wired
  # through shared_preferences by our own identity gateway, so the Flutter
  # plugin's deep-link OAuth machinery — unused, anonymous-only — stays out.
  supabase: ^2.16.1

  # Opens the system share sheet with the restaurant file written by
  # data/share/restaurant_share_writer.dart — from the detail screen (one
  # restaurant), the list's "share all" and Settings' "export my data".
  share_plus: ^13.3.0

  # Delivers a restaurant file opened from outside the app ("Open with EatApp")
  # to the import review screen. On Android it resolves the content:// Uri to a
  # real file path; see the ACTION_VIEW filters in android/app's manifest.
  #
  # Pinned below 1.9.0: that release hard-codes compileSdk 37, past this
  # project's AGP. 1.8.1 targets compileSdk 34 and its missing JVM target is
  # aligned to 17 in android/build.gradle.kts.
  receive_sharing_intent: ">=1.7.0 <1.9.0"

  # The system photo picker (Android Photo Picker / iOS PHPicker). It also
  # bounds the photo natively to the size the app stores — see
  # data/photo/image_picker_photo_picker.dart — and the app copies the file it
  # returns into its own private storage.
  image_picker: ^1.2.3

  # Publishes the home-screen widget's data to the platform's own widget store:
  # an Android shared-preferences file and an iOS App Group. The native halves
  # are presentation-only — see lib/widget/ and android/app/src/main/.
  home_widget: ^0.10.0

  # The version line Settings shows. It reads the values the platform carries
  # rather than a copy kept in Dart: on Android those are the git-derived
  # versionName/versionCode from android/app/build.gradle.kts, so the two can
  # never disagree.
  package_info_plus: ^10.2.1

  # Invitations. qr_flutter draws
  # the invitation QR the owner shows; mobile_scanner reads one back on the
  # joining side (its Android half needs the CAMERA permission declared in the
  # manifest); app_links delivers the eatapp://join/<token> deep link on both a
  # cold and a warm start. All three are presentation/deep-link only — the token
  # itself is validated server-side by the join-group Edge Function.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Runs `flutter gen-l10n` (configured by l10n.yaml) on every build, so the
  # generated AppLocalizations stays in step with the ARB files.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/licenses/

  # Lora carries the humanist display/headline/title styles, Nunito the
  # body/label ones — a warm serif over a friendly rounded sans.
  #
  # Both ship as single variable fonts (one `wght` axis each), so each is
  # registered once with no `weight`; the exact weight is chosen per style via
  # `fontVariations` in the typography tokens rather than by bundling a static
  # file per weight.
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/lora_variable.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito_variable.ttf
