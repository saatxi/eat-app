# --enable-native-access silences the JDK 24+ (JEP 472) "restricted method in
# java.lang.System has been called" warnings Gradle's native-platform loader
# emits when this build runs on a newer JDK (e.g. Android Studio's bundled JBR).
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# Both left at the Flutter template's defaults (false) rather than AGP 9's own
# defaults (true): flipping android.newDsl on breaks the build outright on
# Flutter 3.47.5 — its Gradle plugin reads the old DSL interface, and AGP 9+
# only serves the new one once this flag is on (`ApplicationExtensionImpl
# cannot be cast to AbstractAppExtension`). Revisit once a Flutter release
# supports it; see https://developer.android.com/build/releases/agp-9-0-0-release-notes.
android.newDsl=false
android.builtInKotlin=false
